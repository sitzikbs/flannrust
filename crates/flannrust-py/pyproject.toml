[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "flannrust"
version = "0.1.0"
description = "Bit-exact Rust port of nanoflann's kd-tree, Python bindings"
requires-python = ">=3.9"
license = { text = "BSD-2-Clause" }

[tool.maturin]
module-name = "flannrust"
features = ["pyo3/extension-module"]
