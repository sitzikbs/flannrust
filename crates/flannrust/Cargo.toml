[package]
name = "flannrust"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
license = "BSD-2-Clause"
description = "Bit-exact Rust port of nanoflann's static kd-tree (KDTreeSingleIndexAdaptor)"
repository = "https://github.com/sitzikbs/flannrust"
documentation = "https://docs.rs/flannrust"
keywords = ["kdtree", "nearest-neighbor", "nanoflann", "spatial", "knn"]
categories = ["algorithms", "data-structures", "science"]
readme = "../../README.md"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1", optional = true }
